<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>try{if(!matchMedia("(prefers-reduced-motion: reduce)").matches)document.documentElement.classList.add("intro-on");else document.documentElement.classList.add("intro-done");}catch(e){}</script>
<title>Class Notes Live | MBA M5</title>
<meta name="description" content="Live exam notes for five MBA Marketing courses, generated automatically from classroom recordings.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700;800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F6FA; --card:#FFFFFF; --ink:#16161F; --soft:#666A7F; --faint:#9A9DB0; --rule:#E7E7EF; --glass:rgba(255,255,255,.72);
  --sbm:#E4407A; --retail:#0FA58B; --entre:#EE9A0A; --imc:#3E6CF4; --dsma:#8B5CF6;
  --ok:#14B87A; --warn:#E0492C;
  --f:"Geist","Segoe UI",system-ui,sans-serif; --mono:"Geist Mono",ui-monospace,monospace;
  --r:20px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D0E16; --card:#161722; --ink:#EEEEF6; --soft:#A2A5BA; --faint:#6E7189; --rule:#262839; --glass:rgba(22,23,34,.72);
  --sbm:#F2629A; --retail:#2FCFB0; --entre:#F7B23E; --imc:#6E93FF; --dsma:#A987FF; }}
:root[data-theme="dark"]{
  --bg:#0D0E16; --card:#161722; --ink:#EEEEF6; --soft:#A2A5BA; --faint:#6E7189; --rule:#262839; --glass:rgba(22,23,34,.72);
  --sbm:#F2629A; --retail:#2FCFB0; --entre:#F7B23E; --imc:#6E93FF; --dsma:#A987FF; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--f);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background-image:radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 1px);background-size:22px 22px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--c,var(--imc));outline-offset:2px;border-radius:8px}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---- nav ---- */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;padding:12px 0}
.navin{display:flex;align-items:center;gap:12px;background:var(--glass);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border:1px solid var(--rule);border-radius:18px;padding:8px 10px 8px 14px;box-shadow:0 8px 30px rgba(20,20,50,.06)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;cursor:pointer;background:none;border:0;padding:4px}
.mark{width:28px;height:28px;border-radius:8px;background:conic-gradient(from 200deg,var(--sbm),var(--entre),var(--retail),var(--imc),var(--dsma),var(--sbm));position:relative}
.mark::after{content:"";position:absolute;inset:7px;border-radius:3px;background:var(--card)}
.tabs{position:relative;display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.pill{position:absolute;top:2px;bottom:2px;border-radius:12px;background:var(--pc,var(--ink));transition:left .35s cubic-bezier(.3,1.3,.5,1),width .35s cubic-bezier(.3,1.3,.5,1),background .3s;z-index:0}
.tab{position:relative;z-index:1;border:0;background:none;padding:7px 13px;border-radius:12px;cursor:pointer;font-weight:600;font-size:.9rem;white-space:nowrap;color:var(--soft);display:flex;align-items:center;gap:7px;transition:color .25s}
.tab .d{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tab[aria-current="page"]{color:#fff}
.tab[aria-current="page"] .d{background:#fff}
.tab .nb{font-size:.7rem;background:var(--c);color:#fff;border-radius:999px;padding:0 6px;line-height:1.5}
.tab[aria-current="page"] .nb{background:rgba(255,255,255,.3)}
.iconbtn{border:1px solid var(--rule);background:var(--card);border-radius:12px;height:38px;min-width:38px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:var(--soft);font-size:.86rem;white-space:nowrap;transition:border-color .2s,color .2s}
.iconbtn:hover{border-color:var(--ink);color:var(--ink)}
.iconbtn svg{width:16px;height:16px}
kbd{font:500 .72rem var(--mono);border:1px solid var(--rule);border-radius:6px;padding:1px 5px;background:var(--bg)}
@media (max-width:760px){.iconbtn .lbl{display:none}}

/* ---- common ---- */
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);position:relative;overflow:hidden}
.spot::before{content:"";position:absolute;inset:0;background:radial-gradient(420px circle at var(--mx,-999px) var(--my,-999px),color-mix(in srgb,var(--c,var(--imc)) 13%,transparent),transparent 45%);pointer-events:none;transition:opacity .3s}
.lift{transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s}
.lift:hover{transform:translateY(-3px);box-shadow:0 14px 40px rgba(20,20,60,.10);border-color:color-mix(in srgb,var(--c,var(--ink)) 40%,var(--rule))}
.btn{position:relative;overflow:hidden;border:0;border-radius:12px;padding:10px 18px;font-weight:600;font-size:.92rem;cursor:pointer;background:var(--ink);color:var(--card);display:inline-flex;align-items:center;gap:8px;transition:transform .15s,box-shadow .2s,opacity .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px color-mix(in srgb,var(--c,var(--ink)) 35%,transparent)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.c{background:var(--c);color:#fff}
.btn.shine::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.btn.ghost:hover{border-color:var(--ink);box-shadow:none}
.btn[disabled]{opacity:.45;cursor:default;transform:none;box-shadow:none}
.btn svg{width:16px;height:16px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;border-radius:999px;padding:3px 10px;background:color-mix(in srgb,var(--c,var(--ink)) 12%,transparent);color:var(--c,var(--ink));white-space:nowrap}
.tag.warn{--c:var(--warn)}
.tag.okk{--c:var(--ok)}
.muted{color:var(--soft)}
.enter{animation:enter .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.live{display:inline-flex;align-items:center;gap:8px;font-size:.85rem;color:var(--soft)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 70%,transparent);animation:ping 2s infinite}
.dot.bad{background:var(--warn)}
@keyframes ping{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.banner{margin:6px 0 14px;padding:12px 16px;border-radius:14px;background:color-mix(in srgb,var(--warn) 10%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.banner[hidden]{display:none}
main{padding-bottom:70px;min-height:70vh}

/* ---- home bento ---- */
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(150px,auto);gap:14px;margin-top:8px}
.b-hero{grid-column:span 2;grid-row:span 2;padding:28px;display:flex;flex-direction:column;justify-content:space-between;
  background:linear-gradient(145deg,color-mix(in srgb,var(--imc) 14%,var(--card)),var(--card) 55%,color-mix(in srgb,var(--sbm) 12%,var(--card)))}
.b-hero h1{font-size:clamp(2.1rem,4.6vw,3.5rem);line-height:1;letter-spacing:-.045em;font-weight:800;margin:14px 0 12px;max-width:13ch}
.b-hero h1 .g{background:linear-gradient(90deg,var(--sbm),var(--entre),var(--retail),var(--imc),var(--dsma),var(--sbm));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 6s linear infinite}
@keyframes flow{to{background-position:200% center}}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin:18px 0}
.stat .v{font-size:2.3rem;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.stat .k{font-size:.82rem;color:var(--soft);margin-top:4px}
.b-latest{grid-column:span 2;padding:0;border:0;background:none;overflow:visible}
.gborder{position:relative;border-radius:var(--r);padding:1.5px;height:100%;background:conic-gradient(from var(--ang,0deg),var(--c),transparent 30%,transparent 70%,var(--c));animation:spin 5s linear infinite}
@property --ang{syntax:"<angle>";initial-value:0deg;inherits:false}
@keyframes spin{to{--ang:360deg}}
.gborder>div{background:var(--card);border-radius:calc(var(--r) - 1.5px);height:100%;padding:22px;display:flex;flex-direction:column;gap:10px;cursor:pointer}
.b-latest h3{margin:0;font-size:1.35rem;letter-spacing:-.02em;line-height:1.2}
.b-rings{grid-column:span 2;padding:20px 22px}
.rings{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:10px}
.ring{border:0;background:none;cursor:pointer;text-align:center;padding:6px 2px;border-radius:14px;transition:background .2s}
.ring:hover{background:color-mix(in srgb,var(--c) 8%,transparent)}
.ring svg{width:74px;height:74px;display:block;margin:0 auto}
.ring .arc{transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.ring b{display:block;font-size:.85rem;margin-top:6px}
.ring small{display:block;font-size:.74rem;color:var(--soft)}
.b-todo{grid-column:span 2;padding:20px 22px}
.b-feed{grid-column:1/-1;padding:20px 22px}
.b-feed .rowlist{columns:2;column-gap:28px}.b-feed .rowlist li{break-inside:avoid}
@media (max-width:700px){.b-feed .rowlist{columns:1}}
.b-quiz{grid-column:span 2;padding:20px 22px}
.bh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bh h2{margin:0;font-size:1.02rem;letter-spacing:-.01em}
.rowlist{list-style:none;margin:12px 0 0;padding:0}
.rowlist li{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--rule)}
.rowlist li:first-child{border-top:0}
.rowlist .sw{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.rowlist .t{flex:1;min-width:0}
.rowlist .t b{display:block;font-weight:600;font-size:.93rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowlist .t small{color:var(--soft);font-size:.8rem}
.linkbtn{border:0;background:none;padding:0;cursor:pointer;text-align:left;width:100%}
.mini{padding:6px 12px;font-size:.82rem;border-radius:10px}
@media (max-width:900px){.bento{grid-template-columns:repeat(2,minmax(0,1fr))}.b-hero,.b-latest,.b-rings,.b-todo,.b-feed,.b-quiz{grid-column:span 2}.b-hero{grid-row:auto}}
@media (max-width:520px){.rings{grid-template-columns:repeat(3,minmax(0,1fr))}}

.b-tt{grid-column:1/-1;padding:20px 22px}
.ttgrid{display:grid;grid-template-columns:54px repeat(6,minmax(0,1fr));gap:6px;margin-top:14px;font-size:.84rem}
.tth{text-align:center;font-weight:700;color:var(--soft);padding:4px 0;border-radius:8px}
.tth.today{background:var(--ink);color:var(--card)}
.ttt{font:500 .74rem var(--mono);color:var(--faint);align-self:center}
.ttc{border:0;border-radius:10px;min-height:44px;padding:6px;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;font-weight:700;font-size:.82rem;line-height:1.2}
button.ttc{cursor:pointer;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);transition:transform .15s,background .2s}
button.ttc:hover{transform:translateY(-2px);background:color-mix(in srgb,var(--c) 26%,transparent)}
.ttc.today{outline:1.5px dashed color-mix(in srgb,var(--ink) 25%,transparent);outline-offset:-1px}
.ttc.live{background:var(--c);color:#fff;box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 60%,transparent);animation:ping 2s infinite}
.ttc.live i{font-style:normal;font-size:.68rem;background:rgba(255,255,255,.3);border-radius:999px;padding:0 6px}
.ttc.other{background:var(--bg);color:var(--faint);font-weight:500;font-size:.74rem}
.ttc.empty{background:transparent}

@media (max-width:560px){.ttgrid{grid-template-columns:40px repeat(6,minmax(0,1fr));font-size:.72rem;gap:4px}.ttc{min-height:38px;font-size:.7rem;padding:3px}.ttc.other{font-size:.6rem}}

/* ---- polish: nav, back, bottom bar ---- */
.backbtn[hidden]{display:none}
.navsp{display:none}
.crumb .backlink{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--rule);background:var(--card);border-radius:10px;padding:5px 12px 5px 8px;color:var(--ink);font-weight:600;cursor:pointer;transition:border-color .2s,transform .15s}
.crumb .backlink:hover{border-color:var(--ink);transform:translateX(-2px)}
.crumb .backlink svg{width:16px;height:16px}
.crumb .sep{width:1px;height:16px;background:var(--rule);margin:0 4px}
.bnav{display:none}
@media (max-width:760px){
  .navin .tabs{display:none}.navsp{display:block;flex:1}
  .navin{gap:6px;padding:6px 8px}.navin .iconbtn{min-width:36px;height:36px;padding:0 8px}.brand{gap:8px;padding:2px}
  .brand span{display:inline}
  .bnav{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:44;background:var(--glass);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--rule);border-radius:20px;padding:6px;box-shadow:0 10px 30px rgba(20,20,50,.14)}
  .bnav button{border:0;background:none;border-radius:14px;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.68rem;font-weight:700;color:var(--soft);cursor:pointer;transition:background .2s,color .2s}
  .bnav .bd{width:22px;height:5px;border-radius:3px;background:var(--c);opacity:.35;transition:opacity .2s,width .25s}
  .bnav button[aria-current="page"]{background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--ink)}
  .bnav button[aria-current="page"] .bd{opacity:1;width:28px}
  main{padding-bottom:120px}
  body .fab{bottom:calc(88px + env(safe-area-inset-bottom,0px));right:14px}
  body .toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .alertbar{flex-wrap:nowrap;padding:10px 12px;gap:10px}
  .alertbar .txt{min-width:0;cursor:pointer}
  .alertbar b{font-size:.92rem;display:block}
  .alertbar #alertGo{display:none}
  .segtabs{display:flex;width:100%;overflow-x:auto}
  .segtabs button{flex:1;padding:8px 10px;font-size:.84rem;white-space:nowrap}
  .b-hero{padding:22px}
  .paper{padding:20px 16px 26px}
}
.segtabs button{white-space:nowrap}
.bento.anim>*{animation:enter .55s cubic-bezier(.2,.8,.2,1) both}
.bento.anim>*:nth-child(2){animation-delay:60ms}.bento.anim>*:nth-child(3){animation-delay:120ms}.bento.anim>*:nth-child(4){animation-delay:180ms}.bento.anim>*:nth-child(5){animation-delay:240ms}.bento.anim>*:nth-child(6){animation-delay:300ms}.bento.anim>*:nth-child(7){animation-delay:360ms}.bento.anim>*:nth-child(8){animation-delay:420ms}.bento.anim>*:nth-child(9){animation-delay:480ms}

.sw-auto{display:inline-flex;align-items:center;gap:8px;font-size:.82rem;font-weight:600;color:var(--soft);cursor:pointer}
.sw-auto input{position:absolute;opacity:0;width:1px;height:1px}
.sw-auto span{width:34px;height:20px;border-radius:999px;background:var(--rule);position:relative;transition:background .2s}
.sw-auto span::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw-auto input:checked+span{background:var(--ok)}
.sw-auto input:checked+span::after{transform:translateX(14px)}
.sw-auto input:focus-visible+span{outline:2.5px solid var(--imc);outline-offset:2px}
/* ---- shared (viewer) mode ---- */
.viewer #wBtn,.viewer #bulkBtn,.viewer [data-write],.viewer .sw-auto,.viewer #annAdd,.viewer #annScan,.viewer [data-edit],.viewer [data-del],.viewer #checkBtn,.viewer select[data-move],.viewer .rawfoot label,.viewer .rec .foot label{display:none!important}
/* ---- notes: well-defined layout ---- */
.md{line-height:1.7}
.paper .md{max-width:70ch;font-size:1.02rem;counter-reset:sec}
.paper .md>p:first-child{font-size:1.08rem;padding:16px 18px;border-radius:14px;background:color-mix(in srgb,var(--c) 8%,transparent);border:1px solid color-mix(in srgb,var(--c) 20%,transparent)}
.paper .md h2{display:flex;align-items:center;gap:12px;margin:36px 0 12px;padding-top:22px;border-top:1px solid var(--rule)}
.paper .md h2::before{counter-increment:sec;content:counter(sec,decimal-leading-zero);font:700 .78rem var(--mono);color:#fff;background:var(--c);border-radius:8px;padding:4px 8px;letter-spacing:0}
.paper .md h3{font-size:1.1rem;margin:24px 0 8px;padding-left:12px;border-left:3px solid var(--c);color:var(--ink)}
.md .call{display:grid;grid-template-columns:118px 1fr;gap:12px;align-items:baseline;margin:8px 0;padding:11px 14px;border-radius:12px;background:color-mix(in srgb,var(--cc) 8%,transparent);border-left:3px solid var(--cc)}
.md .call .cl{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--cc)}
.md .call>div{min-width:0}
.c-def{--cc:var(--c)}.c-ex{--cc:var(--retail)}.c-biz{--cc:var(--imc)}.c-tip{--cc:var(--entre)}.c-fx{--cc:var(--dsma)}.c-key{--cc:var(--soft)}
.md .qa{display:flex;gap:12px;align-items:baseline;margin:18px 0 6px;font-weight:700;font-size:1.02rem}
.md .qa .qn{flex:none;font:700 .74rem var(--mono);color:#fff;background:var(--c);border-radius:8px;padding:3px 8px}
.md .qa-a{margin:0 0 8px 46px;padding:10px 14px;border-radius:12px;background:var(--bg);border:1px dashed var(--rule);color:var(--soft)}
.md td:first-child{font-weight:700;color:var(--c)}
.md li strong:first-child{color:var(--c)}
.toc{counter-reset:t}
.toc a::before{counter-increment:t;content:counter(t,decimal-leading-zero);font:500 .72rem var(--mono);color:var(--faint);margin-right:8px}
@media (max-width:560px){.md .call{grid-template-columns:1fr;gap:4px}.md .qa-a{margin-left:0}}

/* ---- announcements ---- */
.bell{position:relative}
.bdg{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;border-radius:999px;background:var(--ok);color:#fff;font:700 .7rem/19px var(--f);padding:0 5px;text-align:center;box-shadow:0 0 0 2px var(--card)}
.bdg.hot{animation:ping 1.6s infinite}
.bdg[hidden]{display:none}
.alertbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:4px 0 14px;padding:12px 16px;border-radius:16px;background:color-mix(in srgb,var(--ok) 13%,var(--card));border:1.5px solid color-mix(in srgb,var(--ok) 55%,transparent);animation:enter .5s both}
.alertbar b{font-size:1.02rem;letter-spacing:-.01em}
.alertbar .ic{width:34px;height:34px;border-radius:10px;background:var(--ok);color:#fff;display:grid;place-items:center;flex:none;animation:ping 2s infinite}
.alertbar .ic svg{width:18px;height:18px}
.alertbar .txt{flex:1;min-width:200px}
.alertbar .x{border:0;background:none;cursor:pointer;color:var(--soft);font-size:1.2rem}
.b-ann{grid-column:1/-1;padding:18px 20px;background:linear-gradient(120deg,color-mix(in srgb,var(--ok) 12%,var(--card)),var(--card) 60%)}
.annrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:12px}
.amini{border:1.5px solid color-mix(in srgb,var(--ok) 50%,transparent);background:var(--card);border-radius:16px;padding:14px 16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .2s,box-shadow .2s}
.amini:hover{transform:translateY(-3px);box-shadow:0 12px 30px color-mix(in srgb,var(--ok) 25%,transparent)}
.amini b{font-size:.98rem;font-weight:800;letter-spacing:-.01em;line-height:1.3}
.amini small{color:var(--soft);font-size:.8rem}
.chipdue{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--ok);color:#fff;width:fit-content}

.ahero{padding:26px;margin-top:8px;display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;background:linear-gradient(135deg,color-mix(in srgb,var(--ok) 16%,var(--card)),var(--card) 70%)}

.acard.up,.acard.tba{border-color:color-mix(in srgb,var(--ok) 55%,transparent);background:color-mix(in srgb,var(--ok) 7%,var(--card))}

.aform{padding:20px;margin-top:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.aform label{display:flex;flex-direction:column;gap:5px;font-size:.85rem;font-weight:600;color:var(--soft)}
.aform input,.aform select,.aform textarea{border:1px solid var(--rule);background:var(--bg);border-radius:10px;padding:9px 12px;font-size:.95rem;color:var(--ink);font-weight:400;outline:none}

.aform .full{grid-column:1/-1}
.aform .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

@media (max-width:620px){.aform{grid-template-columns:1fr}}
.prop{border:1.5px dashed color-mix(in srgb,var(--imc) 50%,transparent);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;background:color-mix(in srgb,var(--imc) 5%,var(--card))}
.prop .t{flex:1;min-width:220px}.prop b{display:block}.prop small{color:var(--soft)}

/* ---- agent ---- */
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:45;border:0;border-radius:18px;padding:13px 18px 13px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;color:#fff;font-weight:700;
  background:linear-gradient(120deg,var(--dsma),var(--imc),var(--sbm));background-size:200% 200%;animation:grad 6s ease infinite;box-shadow:0 14px 34px color-mix(in srgb,var(--imc) 45%,transparent);transition:transform .2s}

.fab svg{width:20px;height:20px}
@keyframes grad{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.agent{position:fixed;right:16px;bottom:16px;top:calc(16px + env(safe-area-inset-top,0px));width:min(470px,calc(100vw - 32px));z-index:46;display:flex;flex-direction:column;border-radius:24px;
  transform:translateY(20px) scale(.97);opacity:0;pointer-events:none;transition:transform .35s cubic-bezier(.3,1.3,.5,1),opacity .25s;box-shadow:0 30px 80px rgba(10,10,40,.3)}
.agent.on{transform:none;opacity:1;pointer-events:auto}
.ahead{padding:16px 18px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:12px}
.ahead .av{width:36px;height:36px;border-radius:12px;background:conic-gradient(from 200deg,var(--sbm),var(--entre),var(--retail),var(--imc),var(--dsma),var(--sbm));display:grid;place-items:center;color:#fff;flex:none}
.ahead .av svg{width:18px;height:18px}
.ahead b{display:block;letter-spacing:-.01em}.ahead small{color:var(--soft)}
.ahead .x{margin-left:auto}
.msgs{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:92%;animation:enter .35s cubic-bezier(.2,.8,.2,1) both}
.msg.u{align-self:flex-end;background:var(--ink);color:var(--card);padding:10px 14px;border-radius:16px 16px 4px 16px;font-size:.94rem;white-space:pre-wrap}

.msg.a .md{font-size:.94rem;max-width:none}
.msg.a .md h2{font-size:1.08rem;margin:16px 0 6px}.msg.a .md h3{font-size:1rem}
.steps{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.steps span{font-size:.8rem;color:var(--soft);display:flex;align-items:center;gap:8px}
.steps span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
.steps span.run::before{background:var(--imc);animation:ping 1.2s infinite}
.mact{display:flex;gap:8px;margin-top:8px}
.mact button{border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:3px 10px;font-size:.78rem;cursor:pointer;color:var(--soft)}
.sugg{display:flex;flex-wrap:wrap;gap:8px}
.sugg button{border:1px solid var(--rule);background:var(--card);border-radius:12px;padding:8px 12px;font-size:.85rem;cursor:pointer;text-align:left;transition:border-color .2s,transform .15s}

.hello{padding:4px 0 6px}.hello h3{margin:0 0 6px;font-size:1.3rem;letter-spacing:-.03em}.hello p{margin:0 0 14px;color:var(--soft);font-size:.92rem}
.ainput{padding:12px;border-top:1px solid var(--rule);display:flex;gap:8px;align-items:flex-end}
.ainput textarea{flex:1;resize:none;border:1px solid var(--rule);background:var(--bg);border-radius:14px;padding:11px 14px;max-height:140px;min-height:46px;outline:none;font:inherit;font-size:.95rem;line-height:1.4;color:var(--ink)}
.ainput textarea:focus{border-color:var(--imc)}
.ainput .btn{height:46px;--c:var(--imc)}
.thinking{display:inline-flex;gap:4px}.thinking i{width:7px;height:7px;border-radius:50%;background:var(--imc);animation:bounce 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}

@media (max-width:560px){.agent{right:0;left:0;bottom:0;top:env(safe-area-inset-top,0px);width:100%;border-radius:20px 20px 0 0}.fab .lbl{display:none}.fab{padding:14px}}

/* ---- course ---- */
.chead{padding:26px;margin-top:8px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 16%,var(--card)),var(--card) 70%)}

.chead .acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.cstats{display:flex;gap:22px;flex-wrap:wrap;margin-top:10px}
.cstats div{font-size:.85rem;color:var(--soft)}.cstats b{display:block;font-size:1.5rem;color:var(--ink);letter-spacing:-.03em}
.bar{height:6px;border-radius:3px;background:var(--rule);overflow:hidden;margin-top:14px}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0 14px}
.search{position:relative;flex:1;min-width:200px;max-width:360px}
.search input{width:100%;border:1px solid var(--rule);background:var(--card);border-radius:12px;padding:10px 14px 10px 38px;outline:none;transition:border-color .2s,box-shadow .2s}
.search input:focus{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 15%,transparent)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--faint)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:12px;padding:3px;background:var(--card)}
.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;font-size:.84rem;font-weight:600;color:var(--soft);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--c);color:#fff}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.dcard{padding:20px;cursor:pointer;display:flex;flex-direction:column;gap:10px;text-align:left;border:1px solid var(--rule);background:var(--card);border-radius:var(--r);width:100%}
.dcard .dt{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.dcard .num{font-size:2.4rem;font-weight:800;letter-spacing:-.05em;line-height:.9;color:var(--c)}
.dcard .mo{font-size:.82rem;color:var(--soft);font-weight:600}
.dcard h3{margin:0;font-size:1.02rem;letter-spacing:-.01em}
.dcard p{margin:0;font-size:.88rem;color:var(--soft);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dcard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:6px}
.dcard .foot small{color:var(--faint);font-size:.8rem}
.dcard.new{box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 60%,transparent)}
.empty{padding:40px 24px;text-align:center;color:var(--soft)}
.empty b{display:block;color:var(--ink);font-size:1.1rem;margin-bottom:6px}

/* ---- day ---- */
.crumb{display:flex;gap:8px;align-items:center;font-size:.88rem;color:var(--soft);margin:10px 0 6px;flex-wrap:wrap}
.crumb button{border:0;background:none;color:var(--soft);cursor:pointer;padding:0;font-weight:600}
.crumb button:hover{color:var(--ink)}
.dhead{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap}
.dhead h1{font-size:clamp(1.7rem,3.8vw,2.6rem);letter-spacing:-.04em;line-height:1.05;margin:4px 0 6px}
.segtabs{position:relative;display:inline-flex;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:4px;margin:18px 0 18px}
.segtabs .ind{position:absolute;top:4px;bottom:4px;border-radius:10px;background:var(--c);transition:left .3s cubic-bezier(.3,1.3,.5,1),width .3s cubic-bezier(.3,1.3,.5,1)}
.segtabs button{position:relative;z-index:1;border:0;background:none;padding:8px 16px;border-radius:10px;font-weight:600;font-size:.9rem;cursor:pointer;color:var(--soft);transition:color .25s}
.segtabs button[aria-selected="true"]{color:#fff}
.notewrap{display:grid;grid-template-columns:220px 1fr;gap:26px;align-items:start}
.toc{position:sticky;top:96px;font-size:.86rem;border-left:2px solid var(--rule);padding-left:14px;max-height:70vh;overflow:auto}
.toc a{display:block;color:var(--soft);text-decoration:none;padding:4px 0;line-height:1.35;border-left:2px solid transparent;margin-left:-16px;padding-left:14px;transition:color .2s,border-color .2s}
.toc a:hover,.toc a.on{color:var(--c);border-left-color:var(--c)}
.toc b{display:block;color:var(--ink);font-size:.8rem;margin-bottom:6px}
@media (max-width:860px){.notewrap{grid-template-columns:1fr}.toc{display:none}}
.paper{padding:28px clamp(18px,4vw,40px) 34px}
.md{max-width:72ch;font-size:1rem}
.md h2{font-size:1.4rem;letter-spacing:-.025em;margin:30px 0 8px;padding-top:6px;scroll-margin-top:100px}
.md h2:first-child{margin-top:0}
.md h3{font-size:1.1rem;letter-spacing:-.01em;margin:22px 0 6px;color:var(--c);scroll-margin-top:100px}
.md h4{font-size:1rem;margin:16px 0 4px}
.md p,.md ul,.md ol{margin:8px 0}
.md ul,.md ol{padding-left:22px}
.md li{margin:5px 0}
.md li::marker{color:var(--c)}
.md strong{font-weight:700}
.md .tw{overflow-x:auto;margin:14px 0;border:1px solid var(--rule);border-radius:12px}
.md table{border-collapse:collapse;font-size:.92rem;width:100%}
.md th,.md td{border-bottom:1px solid var(--rule);padding:9px 12px;text-align:left;vertical-align:top}
.md tr:last-child td{border-bottom:0}
.md th{font-weight:700;background:color-mix(in srgb,var(--c) 9%,transparent)}
.md blockquote{margin:14px 0;padding:10px 16px;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 7%,transparent);border-radius:0 10px 10px 0}
.caret{display:inline-block;width:9px;height:1.1em;background:var(--c);vertical-align:text-bottom;margin-left:2px;border-radius:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.gen{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;background:color-mix(in srgb,var(--c) 8%,transparent);margin-bottom:18px}
.orb{width:30px;height:30px;border-radius:50%;background:conic-gradient(var(--c),transparent 70%);animation:rot .9s linear infinite;-webkit-mask:radial-gradient(circle,transparent 9px,#000 10px);mask:radial-gradient(circle,transparent 9px,#000 10px);flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
.intro{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:18px 0 22px}
.intro div{padding:14px;border-radius:14px;background:var(--bg);font-size:.88rem;color:var(--soft)}
.intro b{display:block;color:var(--ink);margin-bottom:2px}
.progress{position:fixed;left:0;top:0;height:3px;background:var(--c);z-index:40;width:0;transition:width .1s}

/* flashcards */
.fcwrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:10px 0 10px}
.fc{width:min(640px,100%);height:340px;perspective:1400px;cursor:pointer;border:0;background:none;padding:0}
.fc .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.2,.4,1)}
.fc.flip .in{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;padding:30px;display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:left;border:1px solid var(--rule);background:var(--card);overflow:auto}
.fc .front{background:linear-gradient(145deg,color-mix(in srgb,var(--c) 14%,var(--card)),var(--card))}
.fc .back{transform:rotateY(180deg)}
.fc .lab{font-size:.78rem;font-weight:700;color:var(--c)}
.fc .q{font-size:clamp(1.15rem,2.6vw,1.45rem);font-weight:700;letter-spacing:-.02em;line-height:1.3}
.fc .a{font-size:1rem;line-height:1.6}
.fcnav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.dotsrow{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.dotsrow i{width:8px;height:8px;border-radius:50%;background:var(--rule);transition:background .3s,transform .3s}
.dotsrow i.cur{background:var(--c);transform:scale(1.4)}
.dotsrow i.k{background:var(--ok)}.dotsrow i.r{background:var(--warn)}

/* recordings */
.rec{margin-bottom:10px;padding:0}
.rec>button{width:100%;display:flex;align-items:center;gap:12px;padding:14px 18px;border:0;background:none;cursor:pointer;text-align:left}
.rec .tm{font:500 .8rem var(--mono);color:var(--soft);flex:none}
.rec .tt{flex:1;font-weight:600}
.rec .chev{transition:transform .3s;color:var(--faint)}
.rec.open .chev{transform:rotate(180deg)}
.rec .body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.rec.open .body{grid-template-rows:1fr}
.rec .body>div{overflow:hidden}
.rec .inner{padding:0 18px 16px 18px;border-top:1px dashed var(--rule)}
.rec .md h2{display:none}
.rec .foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--soft);margin-top:12px}
.rec select{border:1px solid var(--rule);background:var(--bg);border-radius:9px;padding:5px 8px;font-size:.85rem}

/* palette */
.scrim{position:fixed;inset:0;background:rgba(10,10,30,.4);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.scrim.on{opacity:1;pointer-events:auto}
.pal{position:fixed;left:50%;top:14vh;transform:translate(-50%,-10px) scale(.98);width:min(620px,94vw);z-index:51;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 30px 80px rgba(10,10,40,.3)}
.pal.on{opacity:1;pointer-events:auto;transform:translate(-50%,0) scale(1)}
.pal input{width:100%;border:0;border-bottom:1px solid var(--rule);background:transparent;padding:18px 20px;font-size:1.05rem;outline:none}
.pal ul{list-style:none;margin:0;padding:8px;max-height:52vh;overflow:auto}
.pal li button{width:100%;display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 12px;border-radius:12px;cursor:pointer;text-align:left}
.pal li button[aria-selected="true"]{background:color-mix(in srgb,var(--c) 12%,transparent)}
.pal .sw{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.pal .t{flex:1;min-width:0}.pal .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pal .t small{color:var(--soft)}
.pal .hint{padding:10px 18px;border-top:1px solid var(--rule);font-size:.8rem;color:var(--soft);display:flex;gap:14px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);background:var(--ink);color:var(--card);padding:11px 18px;border-radius:14px;font-size:.92rem;box-shadow:0 12px 34px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .3s,transform .35s cubic-bezier(.3,1.3,.5,1);z-index:60;display:flex;gap:10px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.foot-note{color:var(--faint);font-size:.82rem;margin-top:30px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
.fab{display:none!important}


/* ================= Mono / future edition ================= */
html:root:not([data-theme="light"]){
  --bg:#060606; --card:#0f0f0f; --ink:#f3f3ef; --soft:rgba(243,243,239,.6); --faint:rgba(243,243,239,.34); --rule:rgba(243,243,239,.1); --glass:rgba(10,10,10,.7);
  --sbm:#ff8fb1; --retail:#6ee7c5; --entre:#ffd36e; --imc:#8fb5ff; --dsma:#c5a8ff; --ok:#7cf0a8; --warn:#ff8a6b;
  --chrome:linear-gradient(100deg,#8d8d8d 0%,#ffffff 22%,#9a9a9a 40%,#f0f0f0 58%,#7a7a7a 78%,#ffffff 100%);
}
html:root[data-theme="light"]{
  --bg:#f3f3f0; --card:#ffffff; --ink:#0a0a0a; --soft:rgba(10,10,10,.6); --faint:rgba(10,10,10,.36); --rule:rgba(10,10,10,.1); --glass:rgba(255,255,255,.72);
  --sbm:#d6336c; --retail:#0e9c7b; --entre:#b97f00; --imc:#2f6fe0; --dsma:#7c4ddb; --ok:#1d9a57; --warn:#d2472b;
  --chrome:linear-gradient(100deg,#111 0%,#666 25%,#0a0a0a 50%,#777 75%,#111 100%);
}
:root{--f:"Geist","Segoe UI",system-ui,sans-serif;--d:"Unbounded","Arial Black",system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,monospace;--r:22px;--ease:cubic-bezier(.2,.8,.2,1)}
body{font-family:var(--f);background-image:none;letter-spacing:-.005em}
body::after{content:"";position:fixed;inset:-50%;z-index:70;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");

/* Static-site data layer: serves data.json (built by sync/build.js) through the same
   interface the page already uses, and re-checks for new notes every 2 minutes. */
(function(){
  let data={examnotes:{},announcements:{},config:{}};const subs=[];
  const snapCol=c=>({docs:Object.entries(data[c]||{}).map(([id,v])=>({id,exists:true,data:()=>v}))});
  const snapDoc=p=>{const [c,id]=p.split("/");const v=c==="config"?(data.config||{})[id]:(data[c]||{})[id];return {id,exists:!!v,data:()=>v};};
  const fire=()=>subs.forEach(s=>{try{s.cb(s.col?snapCol(s.col):snapDoc(s.path));}catch(e){}});
  let last="";
  async function load(){
    try{const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;const t=await r.text();
      if(t!==last){const first=!last;last=t;data=JSON.parse(t);window.__dataUpdated=data.generatedAt;fire();if(!first&&window.__onNewData)window.__onNewData();}
      window.__lastCheck=Date.now();if(window.__onCheck)window.__onCheck();
    }catch(e){if(window.__onCheckFail)window.__onCheckFail();}
  }
  const ready=load();setInterval(load,120000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)load();});
  const db={
    doc:p=>({onSnapshot:cb=>{const s={path:p,cb};subs.push(s);ready.then(()=>cb(snapDoc(p)));return()=>{};},get:async()=>{await ready;return snapDoc(p);}}),
    collection:c=>({onSnapshot:cb=>{const s={col:c,cb};subs.push(s);ready.then(()=>cb(snapCol(c)));return()=>{};},get:async()=>{await ready;return snapCol(c);}})
  };
  window.claude={use:async n=>n==="db"?db:n==="user"?{isOwner:async()=>false}:null};
})();
</script>

/* markdown */
function slug(s){return "h-"+s.toLowerCase().replace(/<[^>]+>/g,"").replace(/[^a-z0-9]+/g,"-").slice(0,50);}
function md(src){
  const L=esc(src).split("\n");const out=[];let list=null,tab=null;
  const inl=s=>s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/(^|[\s(])\*(?!\s)([^*]+?)\*(?=[\s).,;:!?]|$)/g,"$1<em>$2</em>");
  const cl=()=>{if(list){out.push(`</${list}>`);list=null;}};

    if(/^\s*\|.*\|\s*$/.test(l)){cl();if(/^\s*\|[\s:|-]+\|\s*$/.test(l))continue;(tab=tab||[]).push(l.trim().slice(1,-1).split("|").map(s=>s.trim()));continue;}

    if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){if(list!=="ol"){cl();out.push("<ol>");list="ol";}out.push(`<li>${inl(m[1])}</li>`);continue;}

/* strip off-topic material from NeoSapien minutes */
function clean(mom){
  const lines=String(mom||"").split("\n");const out=[];let drop=false;
  for(const l of lines){
    const h=l.match(/^#{2,4}\s+(.*)/)||l.match(/^\*\*([^*]{3,60})\*\*\s*$/);
    if(h){drop=OFF_HEAD.test(h[1]);if(!drop)out.push(l);continue;}
    if(drop)continue;
    if(OFF_LINE.test(l))continue;
    out.push(l);
  }
  return out.join("\n").replace(/\n{3,}/g,"\n\n").replace(/###\s+Action Items\s*\n+(?=(#|$))/g,"").trim();
}

/* strict filter */
function strictAuto(m){

}

function timetableAuto(m){

/* flashcards */
function cards(mdSrc){
  const sec=(mdSrc||"").split(/\n(?=##\s)/).find(s=>/^##\s+practice questions/i.test(s));if(!sec)return[];
  const out=[];let cur=null;
  for(const raw of sec.split("\n").slice(1)){const l=raw.trim();if(!l)continue;let m;
    if((m=l.match(/^(?:\d+[.)]\s*)?\*\*\s*Q\s*\d*\s*[.:)]?\s*\*\*\s*[.:]?\s*(.*)$/i))||(m=l.match(/^(?:\d+[.)]\s*)?Q\s*\d*\s*[.:)]\s*(.*)$/i))){cur={q:m[1].replace(/\*\*/g,""),a:""};out.push(cur);continue;}
    if((m=l.match(/^[-*]?\s*\*\*\s*(?:A|Answer|Model answer)\s*[.:]?\s*\*\*\s*[.:]?\s*(.*)$/i))||(m=l.match(/^[-*]?\s*(?:A|Answer|Model answer)\s*[.:]\s*(.*)$/i))){if(cur)cur.a+=(cur.a?"\n":"")+m[1];continue;}
    if((m=l.match(/^\d+[.)]\s+(.*)$/))&&(!cur||cur.a)){cur={q:m[1].replace(/\*\*/g,""),a:""};out.push(cur);continue;}
    if(cur){if(cur.a)cur.a+="\n"+l;else cur.q+=" "+l.replace(/\*\*/g,"");}
  }
  return out.filter(x=>x.q&&x.a);
}

/* generation */
function prompt(c,k,recs){
  const head=`You are writing detailed, exam-ready study notes for an MBA student at CHRIST University, Bengaluru.
Course: ${c.name}. Class date: ${fDay(k)}.
Below are machine-generated minutes from classroom audio for this day, in time order. They come from speech-to-text, so names and terms may be misheard.

STRICT CONTENT RULE: include ONLY material that belongs to the course "${c.name}". Completely leave out anything else: side conversations, gossip, jokes, food, personal matters, placements, other courses, events, attendance and admin chatter. Do not mention that you left anything out.

Write ONE consolidated set of notes in Markdown:
- Start with a 2 to 3 sentence overview of what this class covered (no heading).
- Then "## Key terms": a Markdown table with columns Term | Meaning | Class example, covering every important term from the class (6 to 12 rows, short cells).
- Organise by topic, not by recording. Use "## " for main topics and "### " for subtopics.
- For every concept, framework and model, write these on separate lines: "**Definition:** ..." (one or two plain sentences), then "**Class example:** ...", then "**Business example:** ..." with a real, well-known company case (Indian where possible) that shows the concept at work. Only use real, accurate examples. Where useful, add "**Remember:** ..." for a fact to memorise, "**Exam tip:** ..." for how to use it in an answer, and "**Formula:** ..." for any formula. Frameworks with parts or steps get a numbered list.
- Keep every case, brand example, number, statistic, formula and name the faculty used. Add short standard textbook context only where it helps, marked "(textbook)".
- Where a term or name was clearly misheard, give the likely correct term in brackets.
- Add a section "## What the faculty stressed".
- Add "## Assignments and deadlines" only if any were given in this course.
- End with "## Practice questions": 6 to 8 exam-style questions. Format each exactly as two lines:
**Q1.** question text
**A:** 2 to 4 sentence model answer
Writing style: clear, direct Indian English, active voice, varied sentence length, address the reader as "you". Never use em dashes. Avoid these words: elevate, delve, leverage, harness, unleash, showcase, highlight, insights, synergies, paradigm, ecosystem, profound, groundbreaking, game changer, meanwhile, subsequently, fostering, revolutionize, reimagine, touch point, deep dive. Do not use "not only X but also Y", "From X to Y" or "That's not X. It's Y" constructions.

Recordings:
`;
  let blocks=recs.map(m=>({m,n:clean(S.notes.get(m._id)||m.summary||"")}));
  const budget=MAX_PROMPT-head.length-600,total=blocks.reduce((a,b)=>a+b.n.length+120,0);
  if(total>budget){const r=budget/total;blocks=blocks.map(b=>({m:b.m,n:b.n.slice(0,Math.max(300,Math.floor(b.n.length*r)))}));}
  return head+blocks.map(b=>`\n[${fmtT(b.m.started_at)}] ${b.m.title}\n${b.n}\n`).join("");
}
function genUpdate(){ if(S.route.v==="day"&&S.gen&&S.route.c+"_"+S.route.d===S.gen.key&&S.dayTab==="notes"){const o=$("#genOut"),s=$("#genStep");if(o&&s){s.textContent=S.gen.step;o.innerHTML=S.gen.text?md(S.gen.text)+'<span class="caret"></span>':"";}else render(false);} }
async function generate(cid,k,quiet){
  if(S.gen){toast("Already writing notes for another class. Wait for it to finish.");return false;}
  if(!sample||!mcp){toast("Writing notes needs Claude and NeoSapien access in this view.");return false;}
  const c=BYID[cid],key=ekey(cid,k),recs=model()[cid].get(k)||[];if(!recs.length)return false;
  S.gen={key,step:"Getting ready",text:""};S.genCtl=new AbortController();render(false);
  try{
    for(let i=0;i<recs.length;i++){if(S.genCtl.signal.aborted)throw{code:"cancelled"};S.gen.step=`Reading recording ${i+1} of ${recs.length} from NeoSapien`;genUpdate();await fetchNotes(recs[i]._id);}
    S.gen.step="Claude is thinking. Notes will start appearing in a moment";genUpdate();
    const res=await sample(prompt(c,k,recs),{modelTier:"default",cache:false,signal:S.genCtl.signal,onText:({text})=>{S.gen.step="Writing your notes";S.gen.text=text;genUpdate();}});
    const e={markdown:res.text,generatedAt:new Date().toISOString(),recordingIds:recs.map(m=>m._id),course:cid,day:k};
    S.exam[key]=e;S.gen=null;
    if(db){try{await db.doc("examnotes/"+key).set(e);}catch(x){toast("Notes written but not saved for next time.");}}
    if(!quiet)toast(`Exam notes ready: ${c.short}, ${fShort(k)}${res.truncated?" (cut short, try Write again)":""}`);
    render(false);return true;
  }catch(x){
    const code=x&&x.code;S.gen=null;
    const msg=code==="cancelled"?"Stopped. Nothing was saved.":code==="not_granted"||code==="sampling_disabled"||code==="capability_disabled"?"Writing notes with Claude is not allowed in this view.":code==="rate_limited"?"You hit a usage limit. Try again later.":code==="prompt_too_large"?"This day has too much material to send at once.":code==="session_expired"?"Sign in to claude.ai again, then retry.":code==="refused"?"Claude would not write notes from this material.":"The notes could not be written. Try again.";
    toast(msg);render(false);return code==="cancelled"?null:false;
  }finally{S.genCtl=null;}
}
S.auto=(()=>{try{return localStorage.getItem("lcn.auto")!=="0";}catch(e){return true;}})();S.autoTried=new Set();
function autoWrite(){
  if(!S.owner||!S.auto||S.autoStop||S.gen||S.bulk||!sample||!mcp||!S.first||!S.examLoaded)return;
  const m=model();const now=Date.now();let pick=null;
  for(const c of COURSES){for(const [k,v] of m[c.id]){const key=ekey(c.id,k);if(S.autoTried.has(key))continue;
    const last=new Date(v.at(-1).finished_at||v.at(-1).started_at).getTime();if(now-last<40*60000)continue;
    if(!S.exam[key]||isStale(c.id,k,v)){if(!pick||k>pick.k)pick={c:c.id,k};}}}
  if(!pick)return;
  S.autoTried.add(ekey(pick.c,pick.k));
  generate(pick.c,pick.k,true).then(r=>{if(r===true){toast(`New exam notes written: ${BYID[pick.c].short}, ${fShort(pick.k)}`);setTimeout(autoWrite,1500);}else S.autoStop=true;});
}
async function bulkWrite(cid,keys){
  if(S.gen||S.bulk)return;S.bulk={c:cid,done:0,total:keys.length,stop:false};render(false);

}

  if(!S.chat.length){box.innerHTML=`<div class="hello"><h3>What should I do with your notes?</h3><p>I read your class notes from all five courses and do the task straight away. Try one of these:</p><div class="sugg">${SUGG.map(t=>`<button type="button" data-s="${esc(t)}">${esc(t)}</button>`).join("")}</div></div>`;
    box.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>askAgent(b.dataset.s));return;}
  box.innerHTML=S.chat.map((t,i)=>t.role==="user"?`<div class="msg u">${esc(t.content)}</div>`
    :`<div class="msg a" data-i="${i}">${t.steps&&t.steps.length?`<div class="steps">${t.steps.map((x,j)=>`<span class="${t.pending&&j===t.steps.length-1?"run":""}">${esc(x)}</span>`).join("")}</div>`:""}
      ${t.pending&&!t.content?'<span class="thinking"><i></i><i></i><i></i></span>':`<div class="md">${md(t.content)}${t.pending?'<span class="caret"></span>':""}</div>`}
      ${!t.pending&&t.content?`<div class="mact"><button type="button" data-copy="${i}">Copy</button>${downloads?`<button type="button" data-dl="${i}">Download</button>`:""}</div>`:""}</div>`).join("");
  box.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(S.chat[+b.dataset.copy].content);toast("Copied");}catch(e){toast("Copying is blocked here. Use Download.");}});
  box.querySelectorAll("[data-dl]").forEach(b=>b.onclick=async()=>{try{await downloads.save({filename:"notes assistant answer.md",data:S.chat[+b.dataset.dl].content});}catch(e){if(e.code!=="declined")toast("The file could not be saved.");}});
  box.scrollTop=box.scrollHeight;
}
function setAgentBusy(b){agentBusy=b;const btn=$("#agentSend");btn.textContent=b?"Stop":"Send";btn.type=b?"button":"submit";btn.onclick=b?()=>agentCtl&&agentCtl.abort():null;}
async function askAgent(text){
  text=String(text||"").trim();if(!text||agentBusy)return;
  if(!sample){toast("The assistant needs Claude access in this view.");return;}
  if(toolsOk===null){const lim=await sample.limits().catch(()=>null);toolsOk=!!(lim&&lim.tools);}
  S.chat.push({role:"user",content:text});const ans={role:"assistant",content:"",steps:[],pending:true};S.chat.push(ans);drawChat();
  $("#agentIn").value="";setAgentBusy(true);agentCtl=new AbortController();
  const onStep=x=>{ans.steps.push(x);drawChat();};
  let raf=0;
  try{
    const opts={modelTier:"default",signal:agentCtl.signal,onText:({text})=>{ans.content=text;if(!raf)raf=requestAnimationFrame(()=>{raf=0;drawChat();});}};
    if(toolsOk)opts.tools=agentTools(onStep);else opts.cache=false;
    const res=await sample(agentPrompt(text+(toolsOk?"":"\n(Note: tools are unavailable in this view; answer from general course knowledge and say so.)")),opts);
    ans.content=res.text+(res.truncated?"\n\n*The answer was cut short. Ask for a smaller part at a time.*":"");
  }catch(e){
    const c=e&&e.code;
    const msg=c==="cancelled"?"Stopped.":c==="not_granted"||c==="sampling_disabled"||c==="capability_disabled"?"The assistant is not allowed to use Claude in this view.":c==="rate_limited"?"You hit a usage limit. Try again in a little while.":c==="prompt_too_large"?"That needed too much material at once. Ask about one course or a few class days.":c==="session_expired"?"Sign in to claude.ai again, then retry.":c==="refused"?"I can't help with that one.":"Something went wrong. Try asking again.";
    ans.content=(c!=="refused"&&e&&e.text?e.text+"\n\n":"")+`*${msg}*`;
  }finally{ans.pending=false;cancelAnimationFrame(raf);setAgentBusy(false);agentCtl=null;saveChat();drawChat();}
}
function openAgent(){$("#agent").classList.add("on");$("#fab").style.display="none";drawChat();setTimeout(()=>$("#agentIn").focus(),60);}
function closeAgent(){$("#agent").classList.remove("on");$("#fab").style.display="";}
$("#fab").onclick=openAgent;$("#agentClose").onclick=closeAgent;
$("#agentClear").onclick=()=>{if(agentBusy)return;S.chat=[];saveChat();drawChat();};
$("#agentForm").onsubmit=e=>{e.preventDefault();askAgent($("#agentIn").value);};
$("#agentIn").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();askAgent(e.target.value);}});
$("#agentIn").addEventListener("input",e=>{e.target.style.height="auto";e.target.style.height=Math.min(140,e.target.scrollHeight)+"px";});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#agent").classList.contains("on")&&!$("#pal").classList.contains("on"))closeAgent();});

/* sync */
function ingest(p,announce){
  const nb=[];for(const it of (p&&p.items)||[]){const m=it.memory||it;if(!m||!m._id||!m.started_at||m.archived)continue;if(!S.items.has(m._id))nb.push(m);S.items.set(m._id,m);}
  if(announce&&S.first){const cls=nb.filter(m=>courseOf(m));if(cls.length){const c=BYID[courseOf(cls[0])];toast(cls.length===1?`New ${c.short} lecture from ${fmtT(cls[0].started_at)} added`:`${cls.length} new lectures added`);}}
  return nb.length;
}
const stamp=t=>status("live",`Live, checked ${new Date(t||Date.now()).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",...IST})}`);
function mcpErr(e){const c=e&&e.code;
  if(c==="needs_reauth"){status("bad","NeoSapien needs reconnecting");banner("Your NeoSapien connection has expired. Reconnect it in claude.ai Settings, Connectors, then reload.");S.items.clear();render(false);return;}
  if(c==="server_not_connected"||c==="selection_required"){status("bad","NeoSapien is not connected");banner("Add or choose the NeoSapien connector in claude.ai Settings, Connectors, then reload.");S.items.clear();render(false);return;}
  if(c==="not_in_manifest"||c==="not_granted"||c==="consent_required"){status("bad","NeoSapien access not allowed");banner("This page needs permission to read NeoSapien. Reload and allow it when asked.");return;}
  if(c==="blocked_by_policy"||c==="approval_required"){status("bad","Blocked by your organisation");banner("Your organisation's settings block this page from reading NeoSapien.");return;}
  if(c==="capability_disabled"||c==="capability_removed"){status("bad","Live updates are off here");banner("Open this page from claude.ai to see your notes.");return;}
  status("bad","NeoSapien is not answering, will retry");}
const args=p=>({start_date:START_DATE,limit:100,page:p,sort_by:"created_at",sort_order:"desc",type:"all"});
async function fullSync(){let p=1,n=1;do{const r=await mcp.callTool(SERVER,"search_memories",args(p),{cache:{staleTime:60000}});const pl=r.payload||{};ingest(pl,false);n=pl.total_pages||1;p++;}while(p<=n&&p<=20);}
async function checkNow(){if(!mcp){toast("Still connecting to NeoSapien");return;}const b=$("#checkBtn");if(b)b.disabled=true;
  try{const r=await mcp.callTool(SERVER,"search_memories",args(1),{cache:{refresh:true}});const n=ingest(r.payload,true);stamp();render(false);if(!n)toast("No new lectures yet");}catch(e){mcpErr(e);}finally{const b2=$("#checkBtn");if(b2)b2.disabled=false;}}

async function boot(){
  S.route=parse();render(true);
  let user=null;[db,sample,downloads,user]=await Promise.all(["db","sample","downloads","user"].map(n=>claude.use(n).catch(()=>null)));
  S.owner=user?await user.isOwner().catch(()=>true):true;
  if(S.owner)mcp=await claude.use("mcp").catch(()=>null);
  document.documentElement.classList.toggle("viewer",!S.owner);
  if(db){
    db.collection("announcements").onSnapshot(s=>{const o={};(s.docs||[]).forEach(d=>{const v=d.data();if(v&&v.title)o[d.id]=v;});const first=!S.annLoaded;S.annLoaded=true;S.ann=o;render(false);if(first){const h=annPending().filter(hot);if(h.length)toast(`${h.length} submission${h.length===1?"":"s"} due within 2 days`);}},()=>{});
    db.doc("config/timetable").onSnapshot(s=>{S.tt=s.exists?s.data():null;render(false);},()=>{});
    db.doc("config/allowlist").onSnapshot(s=>{S.allow=s.exists?s.data():null;S.allowReady=true;render(false);},()=>{S.allowReady=true;render(false);});
    db.collection("sorting").onSnapshot(s=>{const o={};(s.docs||[]).forEach(d=>{const v=d.data();if(v&&v.source==="you"&&v.course)o[d.id]=v.course;});S.overrides=o;render(false);},()=>{});
    db.collection("examnotes").onSnapshot(s=>{const o={};(s.docs||[]).forEach(d=>{const v=d.data();if(v&&v.markdown)o[d.id]=v;});S.exam=o;const f=!S.examLoaded;S.examLoaded=true;render(false);if(f)setTimeout(autoWrite,800);},()=>{S.examLoaded=true;});
  }
  if(!S.owner){S.first=true;
    const fmt=d=>new Date(d).toLocaleString("en-IN",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",...IST});
    const show=()=>status("live",`Updated ${window.__dataUpdated?fmt(window.__dataUpdated):"recently"}`);
    window.__onCheck=show;window.__onCheckFail=()=>status("bad","Could not check for new notes, will retry");window.__onNewData=()=>toast("New notes just arrived");
    show();render(true);return;}
  if(!mcp){S.first=true;status("bad","NeoSapien is not available in this view");render(false);return;}
  try{await fullSync();S.first=true;stamp();banner("");render(true);setTimeout(autoWrite,800);}catch(e){S.first=true;mcpErr(e);render(false);}
  mcp.watchTool(SERVER,"search_memories",args(1),ev=>{if(ev.type==="data"){ingest(ev.result.payload,true);stamp(ev.result.cache&&ev.result.cache.storedAt);banner("");render(false);autoWrite();}else mcpErr(ev.error);},{refetchInterval:POLL_MS,cache:{staleTime:60000}});
  const newest=[...S.items.values()].reduce((a,m)=>m.started_at>a?m.started_at:a,"");if(newest){try{localStorage.setItem("lcn.seenUpTo",newest);}catch(e){}}
}
boot();
})();

<script>

(function(){

  function vnoise(){var perm=[];for(var i=0;i<512;i++)perm[i]=Math.random();return function(x,y,z){var xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z),xf=x-xi,yf=y-yi,zf=z-zi;function H(a,b,c){return perm[((a*73856093)^(b*19349663)^(c*83492791))&511];}function L(a,b,t){return a+(b-a)*t;}var u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),w=zf*zf*(3-2*zf);return L(L(L(H(xi,yi,zi),H(xi+1,yi,zi),u),L(H(xi,yi+1,zi),H(xi+1,yi+1,zi),u),v),L(L(H(xi,yi,zi+1),H(xi+1,yi,zi+1),u),L(H(xi,yi+1,zi+1),H(xi+1,yi+1,zi+1),u),v),w);};}

  function Shape(){this.p=new Float32Array(N*3);this.c=new Float32Array(N*3);this.i=0;}
  Shape.prototype.add=function(x,y,z,col,j){if(this.i>=N)return;var k=this.i*3,jj=j||0;this.p[k]=x+(rand()-.5)*jj;this.p[k+1]=y+(rand()-.5)*jj;this.p[k+2]=z+(rand()-.5)*jj;var b=.75+rand()*.35;this.c[k]=col[0]*b;this.c[k+1]=col[1]*b;this.c[k+2]=col[2]*b;this.i++;};

  function rotP(s,ax,ay,az){var ca=Math.cos(ax),sa=Math.sin(ax),cb=Math.cos(ay),sb=Math.sin(ay),cc=Math.cos(az),sc=Math.sin(az);for(var i=0;i<N;i++){var k=i*3,x=s.p[k],y=s.p[k+1],z=s.p[k+2];var y1=y*ca-z*sa,z1=y*sa+z*ca;var x2=x*cb+z1*sb,z2=-x*sb+z1*cb;var x3=x2*cc-y1*sc,y3=x2*sc+y1*cc;s.p[k]=x3;s.p[k+1]=y3;s.p[k+2]=z2;}return s;}

  /* ---------- shapes ---------- */
  var SH={};
  SH.globe=function(){var s=new Shape(),R=2.3;return s.fill(function(s){var u=rand()*2-1,t=rand()*Math.PI*2,q=Math.sqrt(1-u*u),x=Math.cos(t)*q*R,y=u*R,z=Math.sin(t)*q*R;var land=noise(x*.9+5,y*.9+2,z*.9+9)>.5;
    if(land)s.add(x,y,z,mixc(ORANGE,AMBER,rand()),.02);else if(rand()<.38){var lat=Math.round(u*6)/6,lq=Math.sqrt(1-lat*lat);if(rand()<.5)s.add(Math.cos(t)*lq*R,lat*R,Math.sin(t)*lq*R,BLUE,.01);else{var lon=Math.round(t/(Math.PI/8))*(Math.PI/8);s.add(Math.cos(lon)*q*R,y,Math.sin(lon)*q*R,BLUE,.01);}}else if(rand()<.25)s.add(x*1.002,y*1.002,z*1.002,ICE,.03);});};
  SH.rocket=function(){var s=new Shape();s.fill(function(s){pick([
    [.42,function(s){var t=rand()*Math.PI*2,y=-1.3+rand()*2.5,r=.62;s.add(Math.cos(t)*r,y,Math.sin(t)*r,tint(Math.cos(t),y,Math.sin(t),WHITE,ORANGE,1.4),.02);}],
    [.13,function(s){var t=rand()*Math.PI*2,h=rand(),y=1.2+h*1.25,r=.62*(1-h)*(1-h*.15);s.add(Math.cos(t)*r,y,Math.sin(t)*r,BLUE,.02);}],

    [.05,function(s){var t=rand()*Math.PI*2;s.add(Math.cos(t)*.26,.45+Math.sin(t)*.26,.64,WHITE,.015);}],
    [.29,function(s){var h=Math.pow(rand(),.8),t=rand()*Math.PI*2,r=.5*(1-h)*Math.sqrt(rand());s.add(Math.cos(t)*r,-1.35-h*2.2,Math.sin(t)*r,h<.35?WHITE:mixc(AMBER,ORANGE,h),.05);}]],s);});
    return rotP(s,.25,.4,-.7);};
  SH.diamond=function(){var s=new Shape();s.fill(function(s){var F=12;pick([
    [.12,function(s){var r=1.15*Math.sqrt(rand()),t=rand()*Math.PI*2;s.add(Math.cos(t)*r,.8,Math.sin(t)*r,ICE,.01);}],
    [.32,function(s){var h=rand(),t=rand()*Math.PI*2,r=2.1-h*.95,ts=Math.round(t/(Math.PI*2/F))*(Math.PI*2/F),edge=rand()<.35;var tt=edge?ts:t;s.add(Math.cos(tt)*r,h*.8,Math.sin(tt)*r,edge?WHITE:BLUE,.01);}],
    [.48,function(s){var h=rand(),t=rand()*Math.PI*2,r=2.1*(1-h),ts=Math.round(t/(Math.PI*2/F))*(Math.PI*2/F),edge=rand()<.35;var tt=edge?ts:t;s.add(Math.cos(tt)*r,-h*2.4,Math.sin(tt)*r,edge?WHITE:mixc(BLUE,ICE,h),.01);}],
    [.08,function(s){var t=rand()*Math.PI*2,r=2.1;s.add(Math.cos(t)*r,0,Math.sin(t)*r,ORANGE,.02);}]],s);});return rotP(s,.35,0,.1);};
  SH.bag=function(){var s=new Shape(),W=2.3,H=2.5,D=1;s.fill(function(s){pick([
    [.78,function(s){var f=rand()*(2*W*H+2*D*H+W*D),x,y,z;if(f<W*H){x=(rand()-.5)*W;y=rand()*H-1.5;z=D/2;}else if(f<2*W*H){x=(rand()-.5)*W;y=rand()*H-1.5;z=-D/2;}else if(f<2*W*H+D*H){x=W/2*(rand()<.5?1:-1);y=rand()*H-1.5;z=(rand()-.5)*D;}else if(f<2*W*H+2*D*H){x=W/2*(rand()<.5?1:-1);y=rand()*H-1.5;z=(rand()-.5)*D;}else{x=(rand()-.5)*W;y=-1.5;z=(rand()-.5)*D;}s.add(x,y,z,tint(x,y,z,ORANGE,AMBER,1.3),.015);}],
    [.16,function(s){var side=rand()<.5?1:-1,t=rand()*Math.PI;s.add(Math.cos(t)*.6,1+Math.sin(t)*.9,side*D/2,BLUE,.04);}],
    [.06,function(s){s.add((rand()-.5)*W,1-.02,D/2+.01,WHITE,.01);}]],s);});return rotP(s,.2,-.5,0);};
  SH.megaphone=function(){var s=new Shape();s.fill(function(s){pick([
    [.55,function(s){var h=rand(),t=rand()*Math.PI*2,r=.35+h*1.15,x=-1.6+h*2.8;s.add(x,Math.cos(t)*r,Math.sin(t)*r,tint(x,Math.cos(t),0,WHITE,ORANGE,1.2),.015);}],
    [.08,function(s){var t=rand()*Math.PI*2,r=1.5*Math.sqrt(rand());s.add(1.2,Math.cos(t)*r,Math.sin(t)*r,AMBER,.02);}],
    [.07,function(s){s.add(-.9+(rand()-.5)*.35,-.5-rand()*1.1,(rand()-.5)*.3,BLUE,.03);}],
    [.3,function(s){var k=Math.floor(rand()*3),R=1.9+k*.55,t=(rand()-.5)*1.1;s.add(1.2+Math.cos(t)*R*.55,Math.sin(t)*R,(rand()-.5)*.15,BLUE,.03);}]],s);});return rotP(s,.15,-.45,.18);};
  SH.chart=function(){var s=new Shape(),H=[.9,1.5,1.2,2.2,2.9];s.fill(function(s){pick([
    [.62,function(s){var b=Math.floor(rand()*5),h=H[b],x0=-2+b*.95,w=.6,f=rand(),x,y,z;if(f<.7){x=x0+(rand()<.5?0:w);y=rand()*h;z=(rand()-.5)*w;}else if(f<.85){x=x0+rand()*w;y=rand()*h;z=w/2*(rand()<.5?1:-1);}else{x=x0+rand()*w;y=h;z=(rand()-.5)*w;}s.add(x,y-1.4,z,b===4?ORANGE:mixc(BLUE,ICE,b/4),.012);}],

    [.2,function(s){var x=-2.4+rand()*5.2,z=-1+rand()*2;if(rand()<.6)x=Math.round(x*2)/2;else z=Math.round(z*2)/2;s.add(x,-1.42,z,BLUE,.005);}]],s);});return rotP(s,.3,-.55,0);};
  SH.satellite=function(){var s=new Shape();s.fill(function(s){pick([
    [.3,function(s){var x=(rand()-.5)*1.2,y=(rand()-.5)*1.4,z=(rand()-.5)*1.2,ax=Math.floor(rand()*3);if(ax===0)x=.6*(rand()<.5?1:-1);else if(ax===1)y=.7*(rand()<.5?1:-1);else z=.6*(rand()<.5?1:-1);s.add(x,y,z,AMBER,.01);}],
    [.52,function(s){var side=rand()<.5?1:-1,x=side*(.9+rand()*2.2),y=(rand()-.5)*1.1,grid=rand()<.45;if(grid){if(rand()<.5)x=side*(.9+Math.round((Math.abs(x)-.9)/.44)*.44);else y=Math.round(y/.27)*.27;}s.add(x,y,0,grid?ORANGE:mixc(AMBER,ORANGE,rand()),.01);}],

  /* ---------- book ---------- */

    timers.push(setTimeout(function(){intro.classList.add("dust");morphTo(routeShape(),true);timers.push(setTimeout(finishIntro,1300));},FLIP_END+150));
  }
  function skip(){if(done)return;if(!started){started=true;flipStart=performance.now()-FLIP_END;}
    if(U.uFromBook.value>.5&&morphStart<0)morphTo(routeShape(),true);finishIntro();}
  var ty=null,tx0=null;
  intro.addEventListener("wheel",function(e){e.preventDefault();if(Math.abs(e.deltaY)+Math.abs(e.deltaX)>3)start();},{passive:false});
  intro.addEventListener("touchstart",function(e){ty=e.touches[0].clientY;tx0=e.touches[0].clientX;},{passive:true});
  intro.addEventListener("touchmove",function(e){if(ty===null)return;var dy=e.touches[0].clientY-ty,dx=e.touches[0].clientX-tx0;if(Math.abs(dy)>22||Math.abs(dx)>22)start();},{passive:true});
  intro.addEventListener("click",function(e){if(e.target.closest("#iSkip"))return;start();});
  addEventListener("keydown",function(e){if(done)return;if(e.key==="Escape"){skip();return;}if(e.key!=="Tab")start();});
  document.getElementById("iSkip").addEventListener("click",function(e){e.stopPropagation();skip();});
  timers.push(setTimeout(start,9000));
})();
</script>
